# xcube: the Cube-side package of the wechart integration (xcube/). It lives
# only in this fork; upstream has no such file, so pulls never conflict with it.
# Builds and tests the package and its image, which boots both with
# introspection only and serving models from xcube's schema. Each push to
# feat/xcube that passes publishes the image, for amd64 and arm64, to
# ghcr.io/<owner>/xcube as v<cube version>-<commit>.
name: xcube

on:
  push:
    paths:
      - 'xcube/**'
      - '.github/workflows/xcube.yml'
  pull_request:
    paths:
      - 'xcube/**'
      - '.github/workflows/xcube.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -ptest --silent"
          --health-interval 5s
          --health-retries 30
      trino:
        image: trinodb/trino:476
        ports:
          - 8080:8080
        options: >-
          --health-cmd "trino --execute 'SELECT 1'"
          --health-interval 10s
          --health-retries 30
    defaults:
      run:
        working-directory: xcube
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: xcube/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Test, with the live-database suites
        run: npm test
        env:
          INTROSPECTION_TEST_POSTGRES: 127.0.0.1:5432
          INTROSPECTION_TEST_MYSQL: 127.0.0.1:3306
          INTROSPECTION_TEST_TRINO: 127.0.0.1:8080
          XCUBE_TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
          # The Trino client sends the OS user as the Trino user.
          USER: presto

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: xcube
          load: true
          push: false
          tags: xcube:ci
      - name: Boots as Cube does, introspection only, as the non-root user Helm runs it as
        run: |
          docker run -d --name xcube-ci --user 1000 \
            -e CUBEJS_DB_TYPE=postgres -e CUBEJS_DB_HOST=127.0.0.1 \
            -e CUBEJS_API_SECRET=ci -e CUBEJS_DEV_MODE=false \
            -e CUBEJS_CACHE_AND_QUEUE_DRIVER=memory -e CUBEJS_TELEMETRY=false \
            xcube:ci
          for _ in $(seq 1 60); do
            if docker logs xcube-ci 2>&1 | grep -q "is listening on"; then
              docker logs xcube-ci 2>&1 | tail -3
              exit 0
            fi
            sleep 2
          done
          docker logs xcube-ci
          exit 1
      - name: Serves models from xcube's schema, imported through its admin API
        run: xcube/test/image/serving.sh xcube:ci
      - name: No connection's driver takes Cube's environment
        run: docker run --rm -v "$PWD/xcube/test/image:/t:ro" --entrypoint node xcube:ci /t/drivers-env.js
      - name: Tags to publish
        id: tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/xcube'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xcube"
          cube="$(node -p "require('./xcube/package.json').peerDependencies['@cubejs-backend/server-core']")"
          {
            echo "tags<<EOF"
            echo "$image:v$cube-${GITHUB_SHA::10}"
            echo "$image:v$cube-feat-xcube"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to the GitHub Container Registry
        if: steps.tags.outputs.tags
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish, for amd64 and arm64
        id: publish
        if: steps.tags.outputs.tags
        uses: docker/build-push-action@v7
        with:
          context: xcube
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - name: Name what was published
        if: steps.tags.outputs.tags
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "Published $DIGEST, tagged:"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
